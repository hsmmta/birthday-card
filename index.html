      "subtitle": "SOME THINGS STAY SOFT",
      "paragraphs": [
        "日子过得很快，有些心情却走得很慢。直到现在，偶尔遇见好看的风景、听到一句熟悉的话或者重返熟悉的场景，还是会想起你。某个平常的瞬间或是寂静的夜里，也好奇过你最近过得怎样，事情还忙嘛，有没有遇见开心的事。",
        "说来也奇怪，之前笑过的那些“深情行为”，到现在除了真的没好意思像他们这些“前辈”一样发动态外，我也尽在反复干，回旋镖来的有点快了感觉，也终于算明白他们的心情。但之前看你没回也没好意思再发，感觉总是烦也很不好，你也有见习、实习和很多别的事要忙。也只是今天，想借着一句生日快乐，想对你说：曾经的相遇，我一直珍惜；关于你的那份感情，也还在心里，留着原来的位置。"
      ]
    },
    {
      "title": "愿你的明天，顺遂明亮",
      "subtitle": "FOR ALL THE DAYS AHEAD",
      "paragraphs": [
        "未来还有很多季节，等你走过。愿你想做的事渐渐有了回音，想去的地方终会抵达。愿有人理解你的认真，也接得住你的疲惫；更愿你无论身在何处，都能安心地做自己。",
        "如果往后还有机会，想再听你说说生活里的小事。就把这份心意轻轻放在这里，不着急等一个回答。今天属于你，愿你的愿望得以成真，愿你的快乐长长久久。生日快乐。"
      ]
    }
  ]
};
</script><script>'use strict';
const config = window.BIRTHDAY;
const $ = (selector) => document.querySelector(selector);
let page = 0, turning = false, opening = false, wished = false, transitionTimer;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function scene(id) {
  document.querySelectorAll('.scene').forEach(el => {el.hidden = el.id !== id;});
  window.scrollTo({top:0,behavior:'instant'});
}
function home() {
  clearTimeout(transitionTimer); opening = false; turning = false;
  $('#open-envelope').classList.remove('opening'); $('#open-envelope').disabled = false;
  $('#letter-paper').classList.remove('turn-out','turn-in');
  scene('greeting'); $('#show-envelope').focus({preventScroll:true});
}
$('.brand').addEventListener('click', e => {e.preventDefault();home();});
document.querySelectorAll('[data-home]').forEach(btn => btn.addEventListener('click',home));
$('#show-envelope').addEventListener('click',() => {scene('envelope-scene');$('#open-envelope').focus({preventScroll:true});});
$('#open-envelope').addEventListener('click',() => {
  if(opening) return; opening=true; $('#open-envelope').disabled = true;
  $('#open-envelope').classList.add('opening');
  transitionTimer=setTimeout(() => {page=0;renderPage();scene('letter-scene');$('#letter-heading').focus({preventScroll:true});opening=false;},reducedMotion?0:1100);
});
function renderPage() {
  const data=config.pages[page];
  $('#letter-heading').textContent=data.title;
  $('#letter-subtitle').textContent=data.subtitle;
  $('#salutation').textContent=page===0?config.recipient+'：':page===1?'有些心意，想轻轻告诉你：':'最后，把祝福留给你：';
  $('#letter-body').replaceChildren(...data.paragraphs.map(text=>{const p=document.createElement('p');p.textContent=text;return p;}));
  $('#signature').textContent=page===2?config.signature:'愿你安好';
  $('#paper-number').textContent=String(page+1).padStart(2,'0');
  $('#page-top').textContent=String(page+1).padStart(2,'0')+' / 03';
  $('#prev').disabled=page===0;
  $('#next').textContent=page===2?'收信':'下一页 →';
  document.querySelectorAll('[data-page]').forEach(btn=>btn.setAttribute('aria-current',Number(btn.dataset.page)===page?'true':'false'));
}
function turnTo(target) {
  if(turning||target<0||target>=config.pages.length||target===page)return;
  turning=true;$('#letter-paper').classList.remove('turn-in');$('#letter-paper').classList.add('turn-out');
  transitionTimer=setTimeout(()=>{
    page=target;renderPage();$('#letter-paper').classList.remove('turn-out');$('#letter-paper').classList.add('turn-in');
    $('#letter-heading').focus({preventScroll:true});
    if(window.innerWidth<761) window.scrollTo({top:0,behavior:reducedMotion?'instant':'smooth'});
    turning=false;
  },reducedMotion?0:280);
}
$('#prev').addEventListener('click',()=>turnTo(page-1));
$('#next').addEventListener('click',()=>{if(turning)return;if(page===2){home();celebrate();}else turnTo(page+1);});
document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>turnTo(Number(btn.dataset.page))));
document.addEventListener('keydown',e=>{if($('#letter-scene').hidden)return;if(e.key==='ArrowRight'){e.preventDefault();turnTo(page+1);}if(e.key==='ArrowLeft'){e.preventDefault();turnTo(page-1);}});
$('#wish').addEventListener('click',()=>{
  wished=true;$('.cake').classList.add('extinguished');$('#cake-title').textContent='已经许愿的草莓奶油生日蛋糕';
  $('#wish').innerHTML='<span aria-hidden="true">✧</span> 再放一次礼花';
  $('#wish-status').textContent='愿你心里的愿望，都慢慢实现。';celebrate();
});
let animationFrame,particles=[];
function celebrate() {
  if(reducedMotion)return;
  const canvas=$('#confetti'),ctx=canvas.getContext('2d');if(!ctx)return;
  cancelAnimationFrame(animationFrame);
  const w=window.innerWidth,h=window.innerHeight,dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const colors=['#bd747c','#d1ab65','#8f9d80','#e5b7a2','#c1a0b3','#f4d694'];
  particles=Array.from({length:150},(_,i)=>({x:i%2?w+10:-10,y:h*.62,vx:(i%2?-1:1)*(4+Math.random()*10),vy:-6-Math.random()*13,s:3+Math.random()*5,r:Math.random()*6,spin:(Math.random()-.5)*.2,color:colors[i%colors.length],life:0}));
  let last=performance.now(),elapsed=0;
  function frame(now){const dt=Math.min((now-last)/16.667,2);last=now;elapsed+=dt;ctx.clearRect(0,0,w,h);
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.16*dt;p.vx*=Math.pow(.994,dt);p.r+=p.spin*dt;p.life+=dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,Math.min(1,(250-p.life)/55));ctx.fillStyle=p.color;ctx.fillRect(-p.s/2,-p.s,p.s,p.s*1.7);ctx.restore();}
    if(elapsed<250)animationFrame=requestAnimationFrame(frame);else{ctx.clearRect(0,0,w,h);particles=[];}
  }animationFrame=requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{cancelAnimationFrame(animationFrame);const canvas=$('#confetti');canvas.getContext('2d')?.clearRect(0,0,canvas.width,canvas.height);});
setTimeout(celebrate,reducedMotion?0:800);
</script></body></html>
